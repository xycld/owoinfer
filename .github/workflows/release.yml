# Tag vX.Y.Z (a release) or vX.Y.Z-rcN, N >= 1 (a release candidate, published as a pre-release that does not become
# "latest"): build and check all four standard flavours and the Windows CUDA 13 SM75 flavour (build.yml), then publish
# their archives (the full package and the -system-cuda variant of each) and a SHA256SUMS file as a GitHub release.
# X.Y.Z must equal the MI_VERSION_* of
# include/mossinfer/mossinfer.h and an rc must come before vX.Y.Z (.github/scripts/release_version.py), the tagged
# commit must be on main with a successful ci run (.github/scripts/release_gate.sh), and the release must not exist
# yet (a re-run of the same workflow run may finish a partial upload).
# Dry run: Actions > release > Run workflow on main or on a tag (gh workflow run release.yml -r <branch-or-tag>) does
# all of the above except creating the release (gate failures are warnings), and leaves the would-be release assets
# in the release-assets artifact. A dispatch with dry_run unticked is refused: only a tag push publishes, and only
# the publish job has a write token. The dispatch ref is the run's own ref (not an input) because build.yml checks
# out the run's commit.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and check, upload the would-be assets, no release). Must stay ticked.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_rc: ${{ steps.version.outputs.is_rc }}
      archive_version: ${{ steps.version.outputs.archive_version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatches are dry runs only
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::A dispatched release run must be a dry run. Publish by pushing a vX.Y.Z or vX.Y.Z-rcN tag."
          exit 1
      # All history (commits only, no trees or blobs beyond the checkout) for the merge-base and tag checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Fetch main and the tags
        run: git fetch --no-tags --force --filter=tree:0 origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/*:refs/tags/*'
      - name: Tag matches the header version
        id: version
        shell: bash
        run: |
          python3 .github/scripts/release_version.py --self-test
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag=(--tag "$GITHUB_REF_NAME"); else tag=(); fi
          python3 .github/scripts/release_version.py "${tag[@]}" --sha "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: No release for the tag yet
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "re-run (attempt $GITHUB_RUN_ATTEMPT): an existing $GITHUB_REF_NAME release may be a partial upload to finish"
            exit 0
          fi
          if out=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "::error::release $GITHUB_REF_NAME exists; a moved or re-pushed tag must not overwrite it"
            exit 1
          elif [ "$out" != "release not found" ]; then
            echo "::error::cannot look up release $GITHUB_REF_NAME: $out"
            exit 1
          fi
          echo "no release $GITHUB_REF_NAME yet"
      - name: Commit on main with a green ci run
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then mode=(--dry-run); else mode=(); fi
          bash .github/scripts/release_gate.sh "${mode[@]}" "$GITHUB_SHA" origin/main "$GITHUB_REPOSITORY"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 30

  # Checks and gathers the release assets with a read-only token; on a dispatch its artifact is the dry run's result.
  package:
    needs: [version, build]
    runs-on: ubuntu-22.04
    env:
      ARCHIVE_VERSION: ${{ needs.version.outputs.archive_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mossinfer-*
          path: dist
          merge-multiple: true
      - name: Both variants of every flavour
        shell: bash
        working-directory: dist
        run: |
          n=0
          for full in mossinfer-*.zip mossinfer-*.tar.gz; do
            [ -f "$full" ] || continue
            case "$full" in "mossinfer-$ARCHIVE_VERSION-"*) ;; *) echo "$full is not version $ARCHIVE_VERSION"; exit 1 ;; esac
            case "$full" in *-system-cuda.*) continue ;; esac
            case "$full" in *.tar.gz) ext="tar.gz"; base="${full%.tar.gz}" ;; *) ext="zip"; base="${full%.zip}" ;; esac
            test -f "$base-system-cuda.$ext" || { echo "missing $base-system-cuda.$ext"; exit 1; }
            n=$((n + 1))
          done
          echo "$n full archives, each with its -system-cuda variant, all version $ARCHIVE_VERSION"
          test "$n" -gt 0
          sm75="mossinfer-$ARCHIVE_VERSION-windows-cu13-x86_64-sm75.zip"
          test -f "$sm75" || { echo "missing SM75 package $sm75"; exit 1; }
          test -f "${sm75%.zip}-system-cuda.zip" || { echo "missing SM75 system-CUDA package"; exit 1; }
      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          rm -f ./*.sha256
          sha256sum mossinfer-*.zip mossinfer-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l
      # Release candidates: the archives keep the header's X.Y.Z (CPack names them, the binaries report it), so an
      # rc's assets are named and versioned like the final release's; the release body says so and names the commit.
      - name: Release body
        shell: bash
        working-directory: dist
        env:
          IS_RC: ${{ needs.version.outputs.is_rc }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          : > RELEASE_BODY.md
          if [ "$IS_RC" = "true" ]; then
            echo "Release candidate $TAG of $VERSION, built from commit $GITHUB_SHA. The archives and the binaries in" \
              "them carry version $VERSION, so the archive names have no -rc suffix; SHA256SUMS lists them under" \
              "those names." > RELEASE_BODY.md
          fi
          echo "tag $TAG, pre-release $IS_RC, notes since ${PREVIOUS_TAG:-the tag GitHub picks}, body before the notes:"
          cat RELEASE_BODY.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/mossinfer-*.zip
            dist/mossinfer-*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_BODY.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [version, package]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Assets match SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/mossinfer-*.zip
            dist/mossinfer-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          previous_tag: ${{ needs.version.outputs.previous_tag }}
          body_path: dist/RELEASE_BODY.md
          prerelease: ${{ needs.version.outputs.is_rc }}
          make_latest: ${{ needs.version.outputs.is_rc == 'true' && 'false' || 'true' }}
